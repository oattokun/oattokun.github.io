<svg xmlns="http://www.w3.org/2000/svg" width="480" height="560" viewBox="0 0 480 560" role="img" aria-labelledby="title desc">
<title id="title">ตำแหน่งวางโบราจในแปลง 7x7</title>
<desc id="desc">วางโบราจที่ช่อง P ทั้งแปดช่อง เส้นประสีม่วงคลุมแนวนอนแถว 2 และ 6 ตลอดแนว และเข้าหาช่องกลางจากซ้ายและขวา เส้นประสีฟ้าอมเขียวคลุมแนวตั้งคอลัมน์ 2 และ 6 ตลอดแนว และเข้าหาช่องกลางจากบนและล่าง ช่องกลาง 4,4 ปลูกถั่วรันเนอร์ R</desc>
<rect x="1" y="1" width="478" height="558" rx="22" fill="#fffefb" stroke="#e4ecdf" stroke-width="2"/>
<text x="240" y="36" text-anchor="middle" font-family="Tahoma, Noto Sans Thai, sans-serif" font-size="22" font-weight="700" fill="#405c46">วางโบราจ</text>
<text x="240" y="60" text-anchor="middle" font-family="Tahoma, Noto Sans Thai, sans-serif" font-size="14" fill="#68776b">P = โบราจ · R = ถั่วรันเนอร์</text>
<text x="240" y="81" text-anchor="middle" font-family="Tahoma, Noto Sans Thai, sans-serif" font-size="13" fill="#68776b">เส้นเต็มแนว: แถว 2, 6 · คอลัมน์ 2, 6</text>
<text x="240" y="100" text-anchor="middle" font-family="Tahoma, Noto Sans Thai, sans-serif" font-size="13" fill="#68776b">แนวแถว/คอลัมน์ 4 หยุดที่ R กลาง (4,4)</text>
