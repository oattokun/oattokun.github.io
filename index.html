<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>My Personal Wiki</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/wiki-theme.css">
</head>
<body>
  <div id="app">กำลังโหลด Wiki...</div>
  <script>
    window.$docsify = {
      name: 'Wiki ของฉัน',
      repo: '',
      loadSidebar: true, // เปิดใช้งานแถบเมนูด้านข้าง
      subMaxLevel: 2,
      search: {
        paths: 'auto',
        placeholder: 'ค้นหาพืชหรือข้อมูลที่ต้องการ…',
        noData: 'ไม่พบข้อมูลที่ค้นหา',
        depth: 6
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
</body>
</html>
